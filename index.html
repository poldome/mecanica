  <style>

    .modal{position:fixed;inset:0;background:rgba(7,20,34,.66);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.28)}.modal-box.wide{width:min(1120px,100%)}.modal-head{position:sticky;top:0;z-index:2;background:white;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#edf2f6;border-radius:50%;width:35px;height:35px;font-size:19px}.modal-body{padding:22px}.modal-foot{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:9px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#415166}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #acd6f5;border-color:var(--blue)}

:12px;color:var(--muted);font-weight:800}.info-box .value{margin-top:5px;font-weight:800;word-break:break-word}.notes{grid-column:1/-1}.image-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.image-preview .preview{position:relative}.image-preview img{width:90px;height:68px;object-fit:cover;border-radius:8px}.image-preview button{position:absolute;right:-5px;top:-6px;border:0;background:var(--red);color:white;width:21px;height:21px;border-radius:50%}.hint{font-size:12px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:13px 17px;border-radius:11px;z-index:200;box-shadow:var(--shadow);max-width:360px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:grid;place-items:center;padding:25px}.lightbox img{max-width:96vw;max-height:90vh;border-radius:8px}.lightbox button{position:absolute;right:20px;top:20px;border:0;background:white;width:40px;height:40px;border-radius:50%;font-size:22px}.storage{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}

.stats{display:none}.toolbar{margin-top:22px;margin-bottom:0;order:3;box-shadow:none;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-radius:20px}.vehicle-grid{display:flex;flex-direction:column;gap:9px}.vehicle-card{border-radius:18px;box-shadow:0 4px 18px rgba(42,31,26,.045);border:1px solid var(--line)}.vehicle-head{padding:14px 16px;background:#fff;cursor:pointer}.vehicle-title{font-size:16px}.vehicle-body{display:none;padding:15px;background:#fbfaf9}.vehicle-actions{display:none}.vehicle-card.expanded .vehicle-body,.vehicle-card.expanded .vehicle-actions{display:flex}.vehicle-card.expanded .vehicle-body{display:block}.vehicle-card.expanded{box-shadow:var(--shadow)}.vehicle-head:after{content:'⌄';color:#897e78;font-size:20px;transition:.2s}.vehicle-card.expanded .vehicle-head:after{transform:rotate(180deg)}.vehicle-head>div:last-child{display:none}.vehicle-meta{grid-template-columns:repeat(2,1fr)}.vehicle-actions{padding:12px 15px;background:#fbfaf9;gap:7px;flex-wrap:wrap}.vehicle-actions>button:first-child{background:#24201e;color:#fff}.modal{backdrop-filter:blur(16px);background:rgba(22,18,16,.45)}.modal-box{border-radius:26px;box-shadow:0 30px 90px rgba(29,21,17,.24)}.modal-head{border-bottom:1px solid var(--line)}.field input,.field select,.field textarea{border-radius:14px;background:#f8f7f6;padding:12px}.detail-header{background:linear-gradient(145deg,#201d1b,#4b3228);border-radius:20px}.info-box,.record{border-radius:16px}.bottom-zone{max-width:1400px;margin:18px auto 0;padding:0 22px 35px}.bottom-zone .toolbar{display:flex}.backup-strip{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px)}.backup-strip .backup-copy{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.backup-strip .backup-copy strong{font-size:13px;white-space:nowrap}.backup-strip .backup-copy small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.backup-buttons{display:flex;gap:7px}.dashboard-peek{max-width:1400px;margin:0 auto 14px;padding:0 22px}.peek-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;background:rgba(31,27,25,.94);color:#fff;border-radius:20px;box-shadow:var(--shadow)}.peek-copy{display:flex;align-items:center;gap:10px}.peek-copy small{color:#bdb5b0}.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.dash-card{min-width:0;background:#f8f7f6;border:1px solid var(--line);border-radius:18px;padding:14px}.dash-card span{font-size:11px;color:var(--muted);display:block}.dash-card strong{display:block;font-size:22px;margin-top:6px;overflow-wrap:anywhere}.dash-sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.dash-panel{border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}.dash-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.dash-line:last-child{border:0}.dash-line strong{text-align:right;overflow-wrap:anywhere}.modal-box.dashboard-modal{width:min(920px,calc(100% - 28px))}
@media(max-width:650px){.topbar-inner{padding:18px 14px 10px;flex-direction:row;align-items:center}.brand small{display:none}.brand h1{font-size:19px}.brand-mark{width:38px;height:38px}.top-actions{width:auto}.top-actions .btn{padding:9px 11px}.dashboard-peek,.bottom-zone{padding-left:12px;padding-right:12px}.peek-copy small{display:none}.dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-sections{grid-template-columns:1fr}.modal{padding:8px;align-items:flex-end}.modal-box,.modal-box.wide,.modal-box.dashboard-modal{width:100%;height:auto;max-height:94vh;border-radius:26px 26px 18px 18px}.modal-body{padding:14px}.dash-card{padding:12px}.dash-card strong{font-size:18px}.dash-line{flex-direction:column;gap:3px}.dash-line strong{text-align:left}.backup-strip{align-items:stretch;flex-direction:column}.backup-strip .backup-copy{justify-content:center}.backup-buttons{display:grid;grid-template-columns:1fr 1fr}.backup-buttons .btn{width:100%}.toolbar{flex-direction:column;align-items:stretch}.vehicle-actions{flex-direction:column}.vehicle-actions button{width:100%}}

/* V6: programación por fecha/kilómetros sobre diseño Apple */
.backup-strip{padding:7px 10px;min-height:44px;border-radius:15px}.backup-buttons{gap:6px}.backup-buttons .btn{padding:6px 10px!important;min-height:30px;font-size:12px;border-radius:10px;box-shadow:none}.backup-copy strong{font-size:12px!important}.backup-copy small{font-size:10px!important}.vehicle-head{position:relative}.vehicle-card.has-warning .vehicle-head:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:var(--orange)}.vehicle-card.has-overdue .vehicle-head:before{background:var(--red)}.schedule-box{grid-column:1/-1;padding:13px;border-radius:16px;background:#f5f1ee;border:1px solid var(--line)}.schedule-box h4{margin:0 0 10px;font-size:14px}.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reminder-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.reminder-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.reminder-main strong{display:block;font-size:13px}.reminder-main small{display:block;color:var(--muted);margin-top:3px}.warning-summary{margin-top:10px}.vehicle-card.expanded .vehicle-body{animation:revealCard .2s ease-out}@keyframes revealCard{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(max-width:650px){.backup-strip{flex-direction:row;align-items:center}.backup-strip .backup-copy{display:none}.backup-buttons{display:flex;margin-left:auto}.backup-buttons .btn{width:auto!important;flex:none!important;padding:6px 9px!important}.schedule-grid{grid-template-columns:1fr}.reminder-item{align-items:flex-start}.reminder-item .record-tools{flex-shrink:0}}

<body>
<div class="app">
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="brand-mark">🚗</div><div><h1>Control de Vehículos</h1><small>Mantenimientos, averías e historial</small></div></div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="importBtn">Importar</button>
      <button class="btn btn-ghost" id="exportBtn">Guardar / Exportar</button>
      <button class="btn btn-light" id="newVehicleBtn">＋ Nuevo vehículo</button>
    </div>
  </div></header>
  <div class="dashboard-peek"><div class="peek-card"><div class="peek-copy"><strong>Resumen de la flota</strong><small id="peekText">Consulta costes, actividad e incidencias</small></div><button class="btn btn-ghost btn-sm" id="openDashboardBtn">Ver dashboard</button></div></div>
  <main>
    <section class="stats">
      <div class="stat"><div class="stat-label">VEHÍCULOS</div><div class="stat-value" id="statVehicles">0</div><small>registrados</small></div>
      <div class="stat danger"><div class="stat-label">AVERÍAS ABIERTAS</div><div class="stat-value" id="statBreakdowns">0</div><small>pendientes o en curso</small></div>
      <div class="stat warn"><div class="stat-label">ITV PRÓXIMA / VENCIDA</div><div class="stat-value" id="statItv">0</div><small>en los próximos 60 días</small></div>
      <div class="stat"><div class="stat-label">COSTE TOTAL</div><div class="stat-value" id="statCost">0 €</div><small>mantenimientos y averías</small></div>
    </section>
    <section class="toolbar">
      <div class="search"><span>🔎</span><input id="searchInput" placeholder="Buscar matrícula, marca, modelo o VIN..."></div>
      <select id="statusFilter"><option value="all">Todos los vehículos</option><option value="open">Con averías abiertas</option><option value="itv">ITV próxima o vencida</option></select>
      <select id="sortSelect"><option value="plate">Ordenar por matrícula</option><option value="brand">Ordenar por marca/modelo</option><option value="kmDesc">Más kilómetros</option><option value="recent">Actividad reciente</option></select>
    </section>
    <section class="vehicle-grid" id="vehicleGrid"></section>
    <div class="storage" id="storageInfo"></div>
  </main>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div><div id="lightbox" class="lightbox hidden"><button>×</button><img alt="Imagen ampliada"></div>
<script>
'use strict';
const STORAGE_KEY='controlVehiculos_v1';
let db=loadDB(), currentVehicleId=null, tempImages=[];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function emptyDB(){return {version:1,updatedAt:new Date().toISOString(),vehicles:[]}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&Array.isArray(x.vehicles)?x:emptyDB()}catch(e){return emptyDB()}}
function saveDB(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));render();return true}catch(e){toast('No se ha podido guardar. Reduce el número o tamaño de las imágenes.');return false}}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0)}
function num(n){return new Intl.NumberFormat('es-ES').format(Number(n)||0)}
function dateFmt(d){if(!d)return 'Sin fecha';return new Intl.DateTimeFormat('es-ES').format(new Date(d+'T12:00:00'))}
function vehicleById(id){return db.vehicles.find(v=>v.id===id)}
function allRecords(v){return [...(v.maintenance||[]).map(x=>({...x,kind:'maintenance'})),...(v.breakdowns||[]).map(x=>({...x,kind:'breakdown'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function currentKm(v){const kms=allRecords(v).map(r=>Number(r.km)||0).filter(Boolean);return kms.length?Math.max(...kms):0}
function dateState(date,days=30){if(!date)return 'none';const today=new Date();today.setHours(0,0,0,0);const due=new Date(date+'T12:00:00'),diff=Math.ceil((due-today)/86400000);return diff<0?'expired':diff<=days?'soon':'ok'}
function allReminders(v){const manual=(v.reminders||[]).map(r=>({...r,source:'manual'}));const fromMaintenance=(v.maintenance||[]).filter(r=>r.nextDate||r.nextKm).map(r=>({id:'m_'+r.id,type:'Próximo mantenimiento',description:r.type||r.description||'',dueDate:r.nextDate||'',dueKm:Number(r.nextKm)||0,source:'maintenance'}));const fromBreakdowns=(v.breakdowns||[]).filter(r=>r.nextDate||r.nextKm).map(r=>({id:'b_'+r.id,type:'Próxima revisión / reparación',description:r.title||r.description||'',dueDate:r.nextDate||'',dueKm:Number(r.nextKm)||0,source:'breakdown'}));return [...manual,...fromMaintenance,...fromBreakdowns]}
function reminderState(r,v){const ds=dateState(r.dueDate,r.type==='ITV'?60:30),km=currentKm(v),due=Number(r.dueKm)||0,ks=!due?'none':km>=due?'expired':due-km<=1000?'soon':'ok';return ds==='expired'||ks==='expired'?'expired':ds==='soon'||ks==='soon'?'soon':'ok'}
function activeWarnings(v){return allReminders(v).map(r=>({...r,state:reminderState(r,v)})).filter(r=>r.state==='expired'||r.state==='soon')}
function totalCost(v){return allRecords(v).reduce((s,r)=>s+(Number(r.cost)||0),0)}
function itvState(v){const itvs=allReminders(v).filter(r=>r.type==='ITV');if(v.itv)itvs.push({dueDate:v.itv,type:'ITV'});const states=itvs.map(r=>reminderState(r,v));return states.includes('expired')?'expired':states.includes('soon')?'soon':states.length?'ok':'none'}
function recentDate(v){return allRecords(v)[0]?.date||v.createdAt?.slice(0,10)||''}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),3000)}

function renderStats(){const vs=db.vehicles;$('#statVehicles').textContent=vs.length;$('#statBreakdowns').textContent=vs.reduce((n,v)=>n+(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,0);$('#statItv').textContent=vs.reduce((n,v)=>n+activeWarnings(v).length,0);$('#statCost').textContent=money(vs.reduce((s,v)=>s+totalCost(v),0))}
function renderVehicles(){let list=[...db.vehicles],q=$('#searchInput').value.trim().toLowerCase(),f=$('#statusFilter').value,s=$('#sortSelect').value;if(q)list=list.filter(v=>[v.plate,v.brand,v.model,v.vin,v.nickname].some(x=>(x||'').toLowerCase().includes(q)));if(f==='open')list=list.filter(v=>(v.breakdowns||[]).some(x=>x.status!=='Cerrada'));if(f==='itv')list=list.filter(v=>['soon','expired'].includes(itvState(v)));if(s==='plate')list.sort((a,b)=>(a.plate||'').localeCompare(b.plate||''));if(s==='brand')list.sort((a,b)=>`${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`));if(s==='kmDesc')list.sort((a,b)=>currentKm(b)-currentKm(a));if(s==='recent')list.sort((a,b)=>recentDate(b).localeCompare(recentDate(a)));
 const grid=$('#vehicleGrid');if(!list.length){grid.innerHTML=`<div class="empty"><div class="empty-icon">🚙</div><h2>${db.vehicles.length?'No hay coincidencias':'Todavía no hay vehículos'}</h2><p>${db.vehicles.length?'Cambia la búsqueda o los filtros.':'Añade tu primer vehículo para comenzar.'}</p>${db.vehicles.length?'':'<button class="btn btn-primary" onclick="openVehicleForm()">＋ Añadir primer vehículo</button>'}</div>`;return}
 grid.innerHTML=list.map(v=>{const open=(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,warnings=activeWarnings(v),overdue=warnings.some(w=>w.state==='expired'),km=currentKm(v),warningBadges=warnings.slice(0,3).map(w=>`<span class="badge ${w.state==='expired'?'red':'orange'}">${esc(w.type)}${w.dueDate?' · '+dateFmt(w.dueDate):''}${w.dueKm?' · '+num(w.dueKm)+' km':''}</span>`).join('');return `<article class="vehicle-card ${warnings.length?'has-warning':''} ${overdue?'has-overdue':''}"><div class="vehicle-head"><div><div class="vehicle-title">${esc(v.nickname||`${v.brand} ${v.model}`)}</div><div class="plate">${esc(v.plate)}${v.nickname?` · ${esc(v.brand)} ${esc(v.model)}`:''}</div></div><div>🚘</div></div><div class="vehicle-body"><div class="vehicle-meta"><div><div class="meta-label">Último kilometraje registrado</div><div class="meta-value">${km?num(km)+' km':'Sin registros'}</div></div><div><div class="meta-label">Coste acumulado</div><div class="meta-value">${money(totalCost(v))}</div></div></div><div class="badges"><span class="badge">${(v.maintenance||[]).length} mantenimientos</span>${open?`<span class="badge red">${open} avería${open>1?'s':''}</span>`:''}${warningBadges}</div>${warnings.length>3?`<div class="hint warning-summary">Y ${warnings.length-3} aviso${warnings.length-3===1?'':'s'} más</div>`:''}</div><div class="vehicle-actions"><button class="btn btn-soft btn-sm" onclick="openDetail('${v.id}')">Ver historial</button><button class="btn btn-soft btn-sm" onclick="quickAdd('${v.id}','maintenance')">＋ Mantenimiento</button><button class="btn btn-danger btn-sm" onclick="quickAdd('${v.id}','breakdown')">＋ Avería</button><button class="btn btn-soft btn-sm" onclick="openReminderForm('${v.id}')">＋ Programar aviso</button><div><button class="btn btn-soft btn-sm" title="Editar" onclick="openVehicleForm('${v.id}')">✏️</button><button class="btn btn-danger btn-sm" title="Eliminar" onclick="deleteVehicle('${v.id}')">🗑️</button></div></div></article>`}).jo function recordSection(v,kind){const arr=kind==='maintenance'?(v.maintenance||[]):(v.breakdowns||[]),title=kind==='maintenance'?'Mantenimiento':'Avería';return `<div class="section-top"><h3>${kind==='maintenance'?'Historial de mantenimientos':'Historial de averías'}</h3><button class="btn btn-primary btn-sm" onclick="openRecordForm('${kind}')">＋ Añadir ${title.toLowerCase()}</button></div><div class="timeline">${arr.length?[...arr].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>recordHTML(r,kind)).join(''):`<div class="empty"><p>No hay ${kind==='maintenance'?'mantenimientos':'averías'} registrados.</p></div>`}</div>`}

function openRecordForm(kind,rid=null){const v=vehicleById(currentVehicleId),arr=kind==='maintenance'?v.maintenance:v.breakdowns,r=rid?arr.find(x=>x.id===rid):{};tempImages=[...(r.images||[])];const isM=kind==='maintenance';modal(`<form id="recordForm"><div class="modal-head"><h2>${rid?'Editar':'Nuevo'} ${isM?'mantenimiento':'registro de avería'}</h2><button type="button" class="close" onclick="openDetail('${v.id}','${isM?'maintenance':'breakdowns'}')">×</button></div><div class="modal-body"><div class="form-grid">

function openReminderForm(vehicleId,rid=null){currentVehicleId=vehicleId;const v=vehicleById(vehicleId);v.reminders=v.reminders||[];const r=rid?v.reminders.find(x=>x.id===rid):{};modal(`<form id="reminderForm"><div class="modal-head"><h2>${rid?'Editar':'Programar'} aviso</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Tipo *</label><select name="type" required>${['Mantenimiento','Reparación / revisión','ITV','Seguro','Otro'].map(x=>`<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Descripción *</label><input name="description" required value="${esc(r.description||'')}" placeholder="Ej. Cambio de aceite"></div><div class="field"><label>Fecha objetivo</label><input name="dueDate" type="date" value="${r.dueDate||''}"></div><div class="field"><label>Kilometraje objetivo</label><input name="dueKm" type="number" min="0" value="${r.dueKm||''}" placeholder="Ej. 120000"></div><div class="field full"><div class="hint">Puedes indicar fecha, kilómetros o ambos. El aviso se activará al cumplirse cualquiera de las condiciones.</div></div></div></div><div class="modal-foot"><button type="button" class="btn btn-soft" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">Guardar aviso</button></div></form>`);$('#reminderForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.dueKm=Number(x.dueKm)||0;if(!x.dueDate&&!x.dueKm){toast('Indica una fecha o un kilometraje objetivo');return}if(rid)Object.assign(r,x);else v.reminders.push({...x,id:uid('rem'),createdAt:new Date().toISOString()});if(saveDB()){closeModal();toast('Aviso guardado')}}}

function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}

function gallerySection(v){const imgs=allRecords(v).flatMap(r=>(r.images||[]).map(im=>({...im,date:r.date,title:r.title||r.type})));return `<div class="section-top"><h3>Galería de imágenes</h3><span class="hint">${imgs.length} imagen${imgs.length===1?'':'es'}</span></div>${imgs.length?`<div class="gallery">${imgs.map(im=>`<figure><img src="${im.data}" alt="${esc(im.name)}" onclick="showImage(this.src)"><figcaption>${dateFmt(im.date)} · ${esc(im.title||'Registro')}</figcaption></figure>`).join('')}</div>`:'<div class="empty"><p>Las imágenes añadidas a mantenimientos y averías aparecerán aquí.</p></div>'}`}

function exportDB(){if(!db.vehicles.length&&!confirm('La base de datos está vacía. ¿Quieres exportarla igualmente?'))return;const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),d=new Date().toISOString().slice(0,10);a.href=URL.createObjectURL(blob);a.download=`backup_vehiculos_${d}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Copia de seguridad exportada')}
function importDB(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.vehicles))throw Error();if(!confirm(`Se importarán ${x.vehicles.length} vehículos y se reemplazarán los datos actuales. ¿Continuar?`))return;db=x;db.version=1;if(saveDB())toast('Base de datos importada correctamente')}catch(e){toast('El archivo no es una copia de seguridad válida')}};reader.readAsText(file)}

function toggleCard(el){el.closest('.vehicle-card').classList.toggle('expanded')}
function dashboardHTML(){const vs=db.vehicles,open=vs.reduce((n,v)=>n+(v.breakdowns||[]).filter(r=>r.status!=='Cerrada').length,0),itv=vs.filter(v=>['soon','expired'].includes(itvState(v))).length,total=vs.reduce((n,v)=>n+totalCost(v),0),year=String(new Date().getFullYear()),yearCost=vs.reduce((n,v)=>n+allRecords(v).filter(r=>(r.date||'').startsWith(year)).reduce((a,r)=>a+(Number(r.cost)||0),0),0),records=vs.flatMap(v=>allRecords(v));return `<div class="dashboard-grid"><div class="dash-card"><span>Vehículos</span><strong>${vs.length}</strong></div><div class="dash-card"><span>Averías abiertas</span><strong>${open}</strong></div><div class="dash-card"><span>Avisos activos</span><strong>${vs.reduce((n,v)=>n+activeWarnings(v).length,0)}</strong></div><div class="dash-card"><span>Coste total</span><strong>${money(total)}</strong></div></div><div class="dash-sections"><div class="dash-panel"><h3>Economía</h3><div class="dash-line"><span>Coste en ${year}</span><strong>${money(yearCost)}</strong></div><div class="dash-line"><span>Promedio por vehículo</span><strong>${money(vs.length?total/vs.length:0)}</strong></div></div><div class="dash-panel"><h3>Actividad</h3><div class="dash-line"><span>Registros totales</span><strong>${records.length}</strong></div><div class="dash-line"><span>Mantenimientos</span><strong>${vs.reduce((n,v)=>n+(v.maintenance||[]).length,0)}</strong></div><div class="dash-line"><span>Averías registradas</span><strong>${vs.reduce((n,v)=>n+(v.breakdowns||[]).length,0)}</strong></div></div></div>`}
function openDashboard(){modal(`<div class="modal-head"><h2>Dashboard</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${dashboardHTML()}</div>`,true);const box=document.querySelector('.modal-box');if(box)box.classList.add('dashboard-modal')}
function prepareLayout(){const main=document.querySelector('main'),toolbar=document.querySelector('.toolbar'),storage=document.querySelector('#storageInfo');if(!main||!toolbar)return;const zone=document.createElement('div');zone.className='bottom-zone';toolbar.remove();zone.appendChild(toolbar);const strip=document.createElement('div');strip.className='backup-strip';strip.innerHTML=`<div class="backup-copy"><strong>Datos y copias</strong><small>Guardado local automático · crea una copia periódicamente</small></div><div class="backup-buttons"></div>`;zone.appendChild(strip);if(storage){storage.remove();zone.appendChild(storage)}document.querySelector('.app').appendChild(zone);const actions=strip.querySelector('.backup-buttons'),ib=document.querySelector('#importBtn'),eb=document.querySelector('#exportBtn');if(ib){ib.textContent='Importar';ib.className='btn btn-soft';actions.appendChild(ib)}if(eb){eb.textContent='Guardar / Exportar';eb.className='btn btn-primary';actions.appendChild(eb)}document.querySelector('#vehicleGrid').addEventListener('click',e=>{const head=e.target.closest('.vehicle-head');if(head)toggleCard(head)});document.querySelector('#openDashboardBtn').onclick=openDashboard}
prepareLayout();$('#newVehicleBtn').onclick=()=>openVehicleForm();$('#exportBtn').onclick=exportDB;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};$('#searchInput').oninput=renderVehicles;$('#statusFilter').onchange=renderVehicles;$('#sortSelect').onchange=renderVehicles;$('#lightbox button').onclick=()=>$('#lightbox').classList.add('hidden');document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#lightbox').classList.contains('hidden'))$('#lightbox').classList.add('hidden');else closeModal()}});render();
</script>
</body>
</html>
