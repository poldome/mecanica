<body>
<div class="app">
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="brand-mark">🚗</div><div><h1 data-i18n="appTitle">Control de Vehicles</h1><small data-i18n="appSubtitle">Manteniments, avaries i historial</small></div></div>
    <div class="top-actions">
      <div class="lang-switch" id="langSwitch"><button type="button" data-lang="ca">CAT</button><button type="button" data-lang="es">CAS</button></div>
      <button class="btn btn-ghost" id="importBtn" data-i18n="import">Importar</button>
      <button class="btn btn-ghost" id="exportBtn" data-i18n="saveCopy">Desar còpia</button>
      <button class="btn btn-light" id="newVehicleBtn" data-i18n="newVehicle">＋ Nou vehicle</button>
    </div>
  </div></header>
  <div class="dashboard-peek"><div class="peek-card"><div class="peek-copy"><strong data-i18n="fleetSummary">Resum de la flota</strong><small id="peekText" data-i18n="fleetSummarySub">Consulta costos, activitat i incidències</small></div><button class="btn btn-ghost btn-sm" id="openDashboardBtn" data-i18n="viewDashboard">Veure tauler</button></div></div>
  <main>
    <section class="stats">
      <div class="stat"><div class="stat-label">VEHÍCULOS</div><div class="stat-value" id="statVehicles">0</div><small>registrados</small></div>
      <div class="stat danger"><div class="stat-label">AVERÍAS ABIERTAS</div><div class="stat-value" id="statBreakdowns">0</div><small>pendientes o en curso</small></div>
      <div class="stat warn"><div class="stat-label">ITV PRÓXIMA / VENCIDA</div><div class="stat-value" id="statItv">0</div><small>en los próximos 60 días</small></div>
      <div class="stat"><div class="stat-label">COSTE TOTAL</div><div class="stat-value" id="statCost">0 €</div><small>mantenimientos y averías</small></div>
    </section>
    <section class="toolbar">
      <div class="search"><span>🔎</span><input id="searchInput" data-i18n-ph="searchPh" placeholder="Cerca matrícula, marca, model o VIN..."></div>
      <select id="statusFilter"><option value="all" data-i18n="fAll">Tots els vehicles</option><option value="open" data-i18n="fOpen">Amb avaries obertes</option><option value="itv" data-i18n="fItv">ITV propera o vençuda</option></select>
      <select id="sortSelect"><option value="plate" data-i18n="sPlate">Ordena per matrícula</option><option value="brand" data-i18n="sBrand">Ordena per marca/model</option><option value="kmDesc" data-i18n="sKm">Més quilòmetres</option><option value="recent" data-i18n="sRecent">Activitat recent</option></select>
    </section>
    <section class="vehicle-grid" id="vehicleGrid"></section>
    <div class="storage" id="storageInfo"></div>
  </main>
</div>
<input type="file" id="importFile" accept="application/json,.json,text/plain,.txt,text/csv,.csv" class="hidden">
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div><div id="lightbox" class="lightbox hidden"><button>×</button><img alt=""></div>

let LANG=(function(){try{const l=localStorage.getItem(LANG_KEY);return l==='es'||l==='ca'?l:'ca'}catch(e){return 'ca'}})();
function t(k,vars){let str=(T[LANG]&&T[LANG][k])!==undefined?T[LANG][k]:(T.ca[k]!==undefined?T.ca[k]:k);if(vars)for(const p in vars)str=str.split('{'+p+'}').join(vars[p]);return str}
function locale(){return LANG==='es'?'es-ES':'ca-ES'}

const KEY_OF={'Revisión':'optRevision','Aceite y filtros':'optOil','Neumáticos':'optTyres','Frenos':'optBrakes','Batería':'optBattery','ITV':'optItv','Otro':'optOther','Abierta':'stOpen','En reparación':'stRepair','Cerrada':'stClosed','Baja':'prLow','Media':'prMid','Alta':'prHigh','Mantenimiento':'tyMaint','Reparación / revisión':'tyRepair','Seguro':'tyIns','Próximo mantenimiento':'nextMaintenance','Próxima revisión / reparación':'nextReview'};
function tv(value){return value&&KEY_OF[value]?t(KEY_OF[value]):(value||'')}
function opts(list,sel){return list.map(([v,k])=>`<option value="${v}" ${sel===v?'selected':''}>${t(k)}</option>`).join('')}
function applyStaticTexts(){
 document.documentElement.lang=LANG;
 document.title=t('appTitle');
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});

 if(bc){bc.innerHTML=`<strong>${t('dataCopies')}</strong><small>${t('dataCopiesSub')}</small>`}
 document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}
function setLang(l){if(l!==LANG){LANG=l;try{localStorage.setItem(LANG_KEY,l)}catch(e){}closeModal();applyStaticTexts();render()}}
let db=loadDB(), currentVehicleId=null, tempImages=[];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function emptyDB(){return {version:1,updatedAt:new Date().toISOString(),vehicles:[]}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&Array.isArray(x.vehicles)?x:emptyDB()}catch(e){return emptyDB()}}
function saveDB(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));render();return true}catch(e){toast(t('saveError'));return false}}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat(locale(),{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0)}
function num(n){return new Intl.NumberFormat(locale()).format(Number(n)||0)}
function dateFmt(d){if(!d)return t('noDate');return new Intl.DateTimeFormat(locale()).format(new Date(d+'T12:00:00'))}
function vehicleById(id){return db.vehicles.find(v=>v.id===id)}
function allRecords(v){return [...(v.maintenance||[]).map(x=>({...x,kind:'maintenance'})),...(v.breakdowns||[]).map(x=>({...x,kind:'breakdown'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function currentKm(v){const kms=allRecords(v).map(r=>Number(r.km)||0).filter(Boolean);return kms.length?Math.max(...kms):0}
function dateState(date,days=30){if(!date)return 'none';const today=new Date();today.setHours(0,0,0,0);const due=new Date(date+'T12:00:00'),diff=Math.ceil((due-today)/86400000);return diff<0?'expired':diff<=days?'soon':'ok'}
function allReminders(v){const manual=(v.reminders||[]).map(r=>({...r,source:'manual'}));const fromMaintenance=(v.maintenance||[]).filter(r=>r.nextDate||r.nextKm).map(r=>({id:'m_'+r.id,type:'Próximo mantenimiento',description:r.type||r.description||'',dueDate:r.nextDate||'',dueKm:Number(r.nextKm)||0,source:'maintenance'}));const fromBreakdowns=(v.breakdowns||[]).filter(r=>r.nextDate||r.nextKm).map(r=>({id:'b_'+r.id,type:'Próxima revisión / reparación',description:r.title||r.description||'',dueDate:r.nextDate||'',dueKm:Number(r.nextKm)||0,source:'breakdown'}));return [...manual,...fromMaintenance,...fromBreakdowns]}
function reminderState(r,v){const ds=dateState(r.dueDate,r.type==='ITV'?60:30),km=currentKm(v),due=Number(r.dueKm)||0,ks=!due?'none':km>=due?'expired':due-km<=1000?'soon':'ok';return ds==='expired'||ks==='expired'?'expired':ds==='soon'||ks==='soon'?'soon':'ok'}
function activeWarnings(v){return allReminders(v).map(r=>({...r,state:reminderState(r,v)})).filter(r=>r.state==='expired'||r.state==='soon')}
function totalCost(v){return allRecords(v).reduce((s,r)=>s+(Number(r.cost)||0),0)}
function itvState(v){const itvs=allReminders(v).filter(r=>r.type==='ITV');if(v.itv)itvs.push({dueDate:v.itv,type:'ITV'});const states=itvs.map(r=>reminderState(r,v));return states.includes('expired')?'expired':states.includes('soon')?'soon':states.length?'ok':'none'}
function recentDate(v){return allRecords(v)[0]?.date||v.createdAt?.slice(0,10)||''}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),3000)}

function renderStats(){const vs=db.vehicles;$('#statVehicles').textContent=vs.length;$('#statBreakdowns').textContent=vs.reduce((n,v)=>n+(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,0);$('#statItv').textContent=vs.reduce((n,v)=>n+activeWarnings(v).length,0);$('#statCost').textContent=money(vs.reduce((s,v)=>s+totalCost(v),0))}
function renderVehicles(){let list=[...db.vehicles],q=$('#searchInput').value.trim().toLowerCase(),f=$('#statusFilter').value,s=$('#sortSelect').value;if(q)list=list.filter(v=>[v.plate,v.brand,v.model,v.vin,v.nickname].some(x=>(x||'').toLowerCase().includes(q)));if(f==='open')list=list.filter(v=>(v.breakdowns||[]).some(x=>x.status!=='Cerrada'));if(f==='itv')list=list.filter(v=>['soon','expired'].includes(itvState(v)));if(s==='plate')list.sort((a,b)=>(a.plate||'').localeCompare(b.plate||''));if(s==='brand')list.sort((a,b)=>`${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`));if(s==='kmDesc')list.sort((a,b)=>currentKm(b)-currentKm(a));if(s==='recent')list.sort((a,b)=>recentDate(b).localeCompare(recentDate(a)));
 const grid=$('#vehicleGrid');if(!list.length){grid.innerHTML=`<div class="empty"><div class="empty-icon">🚙</div><h2>${db.vehicles.length?t('noMatches'):t('noVehicles')}</h2><p>${db.vehicles.length?t('changeSearch'):t('addFirstHint')}</p>${db.vehicles.length?'':`<button class="btn btn-primary" onclick="openVehicleForm()">${t('addFirst')}</button>`}</div>`;return}
 grid.innerHTML=list.map(v=>{const open=(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,warnings=activeWarnings(v),overdue=warnings.some(w=>w.state==='expired'),km=currentKm(v),warningBadges=warnings.slice(0,3).map(w=>`<span class="badge ${w.state==='expired'?'red':'orange'}">${esc(tv(w.type))}${w.dueDate?' · '+dateFmt(w.dueDate):''}${w.dueKm?' · '+num(w.dueKm)+' km':''}</span>`).join('');return `<article class="vehicle-card ${warnings.length?'has-warning':''} ${overdue?'has-overdue':''}"><div class="vehicle-head"><div><div class="vehicle-title">${esc(v.nickname||`${v.brand} ${v.model}`)}</div><div class="plate">${esc(v.plate)}${v.nickname?` · ${esc(v.brand)} ${esc(v.model)}`:''}</div></div><div>🚘</div></div><div class="vehicle-body"><div class="vehicle-meta"><div><div class="meta-label">${t('lastKm')}</div><div class="meta-value">${km?num(km)+' km':t('noRecords')}</div></div><div><div class="meta-label">${t('accCost')}</div><div class="meta-value">${money(totalCost(v))}</div></div></div><div class="badges"><span class="badge">${(v.maintenance||[]).length} ${t('maintenancesN')}</span>${open?`<span class="badge red">${open} ${open>1?t('breakdownNs'):t('breakdownN')}</span>`:''}${warningBadges}</div>${warnings.length>3?`<div class="hint warning-summary">${warnings.length-3===1?t('andMore',{n:1}):t('andMoreP',{n:warnings.length-3})}</div>`:''}</div><div class="vehicle-actions"><button class="btn btn-soft btn-sm" onclick="openDetail('${v.id}')">${t('viewHistory')}</button><button class="btn btn-soft btn-sm" onclick="quickAdd('${v.id}','maintenance')">${t('addMaint')}</button><button class="btn btn-danger btn-sm" onclick="quickAdd('${v.id}','breakdown')">${t('addBreak')}</button><button class="btn btn-soft btn-sm" onclick="openReminderForm('${v.id}')">${t('schedule')}</button><div><button class="btn btn-soft btn-sm" title="${t('edit')}" onclick="openVehicleForm('${v.id}')">✏️</button><button class="btn btn-danger btn-sm" title="${t('delete')}" onclick="deleteVehicle('${v.id}')">🗑️</button></div></div></article>`}).join('')}

function openVehicleForm(id=null){const v=id?vehicleById(id):{};modal(`<form id="vehicleForm"><div class="modal-head"><h2>${id?t('editVehicle'):t('newVehicleT')}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">

function recordSection(v,kind){const arr=kind==='maintenance'?(v.maintenance||[]):(v.breakdowns||[]),title=kind==='maintenance'?'Mantenimiento':'Avería';return `<div class="section-top"><h3>${kind==='maintenance'?t('maintHistory'):t('breakHistory')}</h3><button class="btn btn-primary btn-sm" onclick="openRecordForm('${kind}')">${kind==='maintenance'?t('addMaintenance'):t('addBreakdown')}</button></div><div class="timeline">${arr.length?[...arr].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>recordHTML(r,kind)).join(''):`<div class="empty"><p>${kind==='maintenance'?t('noMaint'):t('noBreak')}</p></div>`}</div>`}

function openRecordForm(kind,rid=null){const v=vehicleById(currentVehicleId),arr=kind==='maintenance'?v.maintenance:v.breakdowns,r=rid?arr.find(x=>x.id===rid):{};tempImages=[...(r.images||[])];const isM=kind==='maintenance';modal(`<form id="recordForm"><div class="modal-head"><h2>${rid?t('editRec'):t('newRec')} ${isM?t('maintenanceL'):t('breakdownRec')}</h2><button type="button" class="close" onclick="openDetail('${v.id}','${isM?'maintenance':'breakdowns'}')">×</button></div><div class="modal-body"><div class="form-grid">

 <div class="field"><label>${t('workshop')}</label><input name="workshop" value="${esc(r.workshop||'')}"></div>${isM?'<div></div>':`<div class="field"><label>${t('status')}</label><select name="status">${opts(OPT_STATUS,r.status)}</select></div><div class="field"><label>${t('priorityL')}</label><select name="priority">${opts(OPT_PRIORITY,r.priority)}</select></div>`}
 <div class="field full"><label>${t('descLabel')} *</label><textarea name="description" required placeholder="${t('descPh')}">${esc(r.description||'')}</textarea></div><div class="schedule-box"><h4>${isM?t('schedNextMaint'):t('schedNextRep')} ${t('optional')}</h4><div class="schedule-grid"><div class="field"><label>${t('nextDate')}</label><input name="nextDate" type="date" value="${r.nextDate||''}"></div><div class="field"><label>${t('nextKm')}</label><input name="nextKm" type="number" min="0" value="${r.nextKm||''}" placeholder="Ej. 120000"></div></div></div><div class="field full"><label>${t('images')}</label><input id="imageInput" type="file" accept="image/*" multiple><div class="hint">${t('imgHint')}</div><div class="image-preview" id="imagePreview"></div></div></div></div><div class="modal-foot"><button type="button" class="btn btn-soft" onclick="openDetail('${v.id}','${isM?'maintenance':'breakdowns'}')">${t('cancel')}</button><button class="btn btn-primary">${t('saveRecord')}</button></div></form>`);
 renderImagePreview();$('#imageInput').onchange=async e=>{for(const file of e.target.files){try{tempImages.push({id:uid('img'),name:file.name,data:await compressImage(file)})}catch(err){toast(t('imgError')+file.name)}}renderImagePreview()};$('#recordForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));delete x[''];x.km=Number(x.km)||0;x.cost=Number(x.cost)||0;x.nextKm=Number(x.nextKm)||0;x.images=tempImages;if(rid)Object.assign(r,x);else arr.push({...x,id:uid('rec'),createdAt:new Date().toISOString()});if(saveDB()){openDetail(v.id,isM?'maintenance':'breakdowns');toast(t('recordSaved'))}}}
function reminderListHTML(v){const list=allReminders(v);return `<div class="info-box notes"><div class="section-top"><div><div class="label">${t('upcomingAlerts')}</div></div><button class="btn btn-soft btn-sm" onclick="openReminderForm('${v.id}')">${t('scheduleBtn')}</button></div>${list.length?`<div class="reminder-list">${list.map(r=>{const st=reminderState(r,v);return `<div class="reminder-item"><div class="reminder-main"><strong>${esc(tv(r.type)||t('alert'))} ${st==='expired'?'🔴':st==='soon'?'🟠':''}</strong><small>${esc(tv(r.description)||t('noDescription'))}${r.dueDate?' · '+dateFmt(r.dueDate):''}${r.dueKm?' · '+num(r.dueKm)+' km':''}</small></div>${r.source==='manual'?`<div class="record-tools"><button class="btn btn-soft btn-sm" onclick="openReminderForm('${v.id}','${r.id}')">${t('edit')}</button><button class="btn btn-danger btn-sm" onclick="deleteReminder('${v.id}','${r.id}')">${t('delete')}</button></div>`:''}</div>`}).join('')}</div>`:`<div class="hint">${t('noAlerts')}</div>`}</div>`}
function openReminderForm(vehicleId,rid=null){currentVehicleId=vehicleId;const v=vehicleById(vehicleId);v.reminders=v.reminders||[];const r=rid?v.reminders.find(x=>x.id===rid):{};modal(`<form id="reminderForm"><div class="modal-head"><h2>${rid?t('editAlert'):t('scheduleAlert')} ${t('alertT')}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>${t('type')} *</label><select name="type" required>${opts(OPT_ALERT,r.type)}</select></div><div class="field"><label>${t('description')} *</label><input name="description" required value="${esc(r.description||'')}" placeholder="${t('descAlertPh')}"></div><div class="field"><label>${t('dueDate')}</label><input name="dueDate" type="date" value="${r.dueDate||''}"></div><div class="field"><label>${t('dueKm')}</label><input name="dueKm" type="number" min="0" value="${r.dueKm||''}" placeholder="Ej. 120000"></div><div class="field full"><div class="hint">${t('alertHint')}</div></div></div></div><div class="modal-foot"><button type="button" class="btn btn-soft" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary">${t('saveAlert')}</button></div></form>`);$('#reminderForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.dueKm=Number(x.dueKm)||0;if(!x.dueDate&&!x.dueKm){toast(t('needTarget'));return}if(rid)Object.assign(r,x);else v.reminders.push({...x,id:uid('rem'),createdAt:new Date().toISOString()});if(saveDB()){closeModal();toast(t('alertSaved'))}}}
function deleteReminder(vehicleId,rid){if(!confirm(t('confirmDeleteAlert')))return;const v=vehicleById(vehicleId);v.reminders=(v.reminders||[]).filter(x=>x.id!==rid);saveDB();openDetail(vehicleId);toast(t('alertDeleted'))}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}

function deleteRecord(kind,id){if(!confirm(t('confirmDeleteRecord')))return;const v=vehicleById(currentVehicleId),key=kind==='maintenance'?'maintenance':'breakdowns';v[key]=v[key].filter(x=>x.id!==id);saveDB();openDetail(v.id,key==='maintenance'?'maintenance':'breakdowns');toast(t('recordDeleted'))}

function showImage(src){$('#lightbox img').src=src;$('#lightbox').classList.remove('hidden')}
let pendingShareFile=null;
function buildBackupPayload(){
 const json=JSON.stringify(db,null,2),d=new Date().toISOString().slice(0,10);
 return {json,base:`backup_vehiculos_${d}`};
}
function prepareShareFile(){
 pendingShareFile=null;
 if(!window.isSecureContext)return{ok:false,reason:t('noHttps')};
 if('showSaveFilePicker' in window)return{ok:true,mode:'picker'};
 if(!navigator.share||!navigator.canShare)return{ok:false,reason:t('noShare')};
 const {json,base}=buildBackupPayload();
 for(const [ext,type] of [['.txt','text/plain'],['.json','application/json'],['.csv','text/csv']]){
  try{
   const f=new File([json],base+ext,{type});
   if(navigator.canShare({files:[f]})){pendingShareFile=f;return{ok:true,mode:'share'}}
  }catch(e){}
 }
 return{ok:false,reason:t('noShareType')};
}
function chooseDestination(){
 if('showSaveFilePicker' in window){pickAndSaveBackup();return}
 if(!pendingShareFile){toast(t('noFile'));return}
 navigator.share({files:[pendingShareFile]}).then(()=>{
  closeModal();toast(t('sentOk'));
 }).catch(err=>{
  const n=err&&err.name;
  if(n==='AbortError'){toast(t('cancelled'));return}
  if(n==='NotAllowedError'){shareTextFallback();return}
  toast(t('saveFail')+(err&&err.message?err.message:n||'error'));
 });
}
function shareTextFallback(){
 const {json}=buildBackupPayload();
 if(!navigator.share){toast(t('useDownload'));return}
 navigator.share({title:'Copia de seguridad de vehículos',text:json}).then(()=>{
  closeModal();toast(t('sentOk'));
 }).catch(err=>{
  if(err&&err.name==='AbortError'){toast(t('cancelled'));return}
  toast(t('denied'));
 });
}
async function pickAndSaveBackup(){
 const {json,base}=buildBackupPayload();
 try{
  const handle=await window.showSaveFilePicker({suggestedName:base+'.json',types:[{description:'Copia de seguridad JSON',accept:{'application/json':['.json']}}]});
  const w=await handle.createWritable();await w.write(json);await w.close();
  closeModal();toast(t('savedOk'));
 }catch(err){
  if(err&&err.name==='AbortError'){toast(t('cancelled'));return}
  toast(t('saveFail2'));
 }
}
function downloadBackup(){
 const {json,base}=buildBackupPayload();
 const blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=base+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 closeModal();toast(t('downloadedOk'));
}
function exportDB(){
 if(!db.vehicles.length&&!confirm(t('emptyDbConfirm')))return;
 const sup=prepareShareFile();
 modal(`<div class="modal-head"><h2>${t('saveCopyT')}</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="modal-body"><div class="save-options">
  <button class="btn btn-primary save-option" ${sup.ok?'':'disabled'} onclick="chooseDestination()"><strong>${t('chooseWhere')}</strong><small>${sup.ok?(sup.mode==='picker'?t('pickerHint'):t('shareHint')):esc(sup.reason)}</small></button>
  <button class="btn btn-soft save-option" onclick="downloadBackup()"><strong>${t('downloadDevice')}</strong><small>${t('downloadHint')}</small></button>
 </div></div>`);
}
function importDB(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.vehicles))throw Error();if(!confirm(t('importConfirm',{n:x.vehicles.length})))return;db=x;db.version=1;if(saveDB())toast(t('importedOk'))}catch(e){toast(t('invalidFile'))}};reader.readAsText(file)}
function toggleCard(el){el.closest('.vehicle-card').classList.toggle('expanded')}
function dashboardHTML(){const vs=db.vehicles,open=vs.reduce((n,v)=>n+(v.breakdowns||[]).filter(r=>r.status!=='Cerrada').length,0),itv=vs.filter(v=>['soon','expired'].includes(itvState(v))).length,total=vs.reduce((n,v)=>n+totalCost(v),0),year=String(new Date().getFullYear()),yearCost=vs.reduce((n,v)=>n+allRecords(v).filter(r=>(r.date||'').startsWith(year)).reduce((a,r)=>a+(Number(r.cost)||0),0),0),records=vs.flatMap(v=>allRecords(v));return `<div class="dashboard-grid"><div class="dash-card"><span>${t('vehiclesL')}</span><strong>${vs.length}</strong></div><div class="dash-card"><span>${t('openBreak')}</span><strong>${open}</strong></div><div class="dash-card"><span>${t('activeAlerts')}</span><strong>${vs.reduce((n,v)=>n+activeWarnings(v).length,0)}</strong></div><div class="dash-card"><span>${t('totalCost')}</span><strong>${money(total)}</strong></div></div><div class="dash-sections"><div class="dash-panel"><h3>${t('economy')}</h3><div class="dash-line"><span>${t('costIn')} ${year}</span><strong>${money(yearCost)}</strong></div><div class="dash-line"><span>${t('avgVehicle')}</span><strong>${money(vs.length?total/vs.length:0)}</strong></div></div><div class="dash-panel"><h3>${t('activity')}</h3><div class="dash-line"><span>${t('totalRecords')}</span><strong>${records.length}</strong></div><div class="dash-line"><span>${t('maintenancesL')}</span><strong>${vs.reduce((n,v)=>n+(v.maintenance||[]).length,0)}</strong></div><div class="dash-line"><span>${t('breakdownsRec')}</span><strong>${vs.reduce((n,v)=>n+(v.breakdowns||[]).length,0)}</strong></div></div></div>`}
function openDashboard(){modal(`<div class="modal-head"><h2>${t('dashboard')}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${dashboardHTML()}</div>`,true);const box=document.querySelector('.modal-box');if(box)box.classList.add('dashboard-modal')}
function prepareLayout(){const main=document.querySelector('main'),toolbar=document.querySelector('.toolbar'),storage=document.querySelector('#storageInfo');if(!main||!toolbar)return;const zone=document.createElement('div');zone.className='bottom-zone';toolbar.remove();zone.appendChild(toolbar);const strip=document.createElement('div');strip.className='backup-strip';strip.innerHTML=`<div class="backup-copy"><strong>${t('dataCopies')}</strong><small>${t('dataCopiesSub')}</small></div><div class="backup-buttons"></div>`;zone.appendChild(strip);if(storage){storage.remove();zone.appendChild(storage)}document.querySelector('.app').appendChild(zone);const actions=strip.querySelector('.backup-buttons'),ib=document.querySelector('#importBtn'),eb=document.querySelector('#exportBtn');if(ib){ib.setAttribute('data-i18n','import');ib.textContent=t('import');ib.className='btn btn-soft';actions.appendChild(ib)}if(eb){eb.setAttribute('data-i18n','saveCopy');eb.textContent=t('saveCopy');eb.className='btn btn-primary';actions.appendChild(eb)}document.querySelector('#vehicleGrid').addEventListener('click',e=>{const head=e.target.closest('.vehicle-head');if(head)toggleCard(head)});document.querySelector('#openDashboardBtn').onclick=openDashboard}
prepareLayout();document.querySelectorAll('#langSwitch button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));applyStaticTexts();$('#newVehicleBtn').onclick=()=>openVehicleForm();$('#exportBtn').onclick=exportDB;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};$('#searchInput').oninput=renderVehicles;$('#statusFilter').onchange=renderVehicles;$('#sortSelect').onchange=renderVehicles;$('#lightbox button').onclick=()=>$('#lightbox').classList.add('hidden');document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#lightbox').classList.contains('hidden'))$('#lightbox').classList.add('hidden');else closeModal()}});render();
</script>
