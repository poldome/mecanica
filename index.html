<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10243e">
  <title>Control de Vehículos</title>
  <style>
    :root{--navy:#10243e;--navy2:#17395f;--blue:#2878c8;--cyan:#58b7d9;--bg:#f3f6f9;--card:#fff;--text:#182433;--muted:#657487;--line:#dce4eb;--green:#29966f;--orange:#e58b25;--red:#d64550;--shadow:0 10px 30px rgba(16,36,62,.09);--radius:16px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer} .hidden{display:none!important}
    .app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(125deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.16)}
    .topbar-inner{max-width:1400px;margin:auto;padding:15px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;margin:0}.brand small{opacity:.74}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--blue);color:#fff}.btn-light{background:#fff;color:var(--navy)}.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}.btn-soft{background:#edf4fb;color:var(--navy2)}.btn-danger{background:#fff0f1;color:var(--red)}.btn-sm{padding:7px 10px;font-size:13px}
    main{max-width:1400px;margin:auto;padding:24px 22px 50px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(16,36,62,.05)}.stat-label{font-size:13px;color:var(--muted);font-weight:700}.stat-value{font-size:28px;font-weight:850;margin-top:7px}.stat small{color:var(--muted)}.stat.danger .stat-value{color:var(--red)}.stat.warn .stat-value{color:var(--orange)}
    .toolbar,.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(16,36,62,.05)}.toolbar{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:18px}.search{flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);padding:11px 12px 11px 39px;border-radius:11px;background:#f9fbfc}.search span{position:absolute;left:13px;top:11px}.toolbar select{border:1px solid var(--line);padding:11px;border-radius:11px;background:white}
    .vehicle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.vehicle-card{background:white;border:1px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.18s}.vehicle-card:hover{transform:translateY(-2px);border-color:#b7d4ec}.vehicle-head{padding:18px;background:linear-gradient(135deg,#f9fcff,#edf5fb);display:flex;justify-content:space-between;gap:12px}.vehicle-title{font-size:19px;font-weight:850}.plate{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:850;letter-spacing:.7px;color:var(--blue)}.vehicle-body{padding:16px}.vehicle-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}.meta-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.meta-value{margin-top:3px;font-weight:700}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;font-weight:800;border-radius:99px;padding:5px 8px;background:#edf4fb;color:var(--navy2)}.badge.red{background:#fff0f1;color:var(--red)}.badge.orange{background:#fff4e8;color:#a45b09}.badge.green{background:#eaf8f3;color:#167154}.vehicle-actions{border-top:1px solid var(--line);padding:11px 16px;display:flex;justify-content:space-between;gap:8px}.empty{grid-column:1/-1;text-align:center;padding:55px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}.empty-icon{font-size:48px}.empty h2{margin-bottom:7px}.empty p{color:var(--muted);max-width:550px;margin:0 auto 20px}
    .modal{position:fixed;inset:0;background:rgba(7,20,34,.66);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.28)}.modal-box.wide{width:min(1120px,100%)}.modal-head{position:sticky;top:0;z-index:2;background:white;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#edf2f6;border-radius:50%;width:35px;height:35px;font-size:19px}.modal-body{padding:22px}.modal-foot{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:9px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#415166}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #acd6f5;border-color:var(--blue)}
    .detail-header{display:flex;justify-content:space-between;gap:20px;padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;margin-bottom:18px}.detail-header h3{font-size:25px;margin:0 0 4px}.detail-km{font-size:24px;font-weight:850;text-align:right}.tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:transparent;padding:11px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--blue);border-color:var(--blue)}.tab-content{display:none}.tab-content.active{display:block}.section-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-top h3{margin:0}.timeline{display:flex;flex-direction:column;gap:11px}.record{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:14px;display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:start}.record.breakdown{border-left-color:var(--red)}.record-date{font-weight:850}.record-km{font-size:12px;color:var(--muted);margin-top:4px}.record-title{font-weight:850;margin-bottom:5px}.record-desc{white-space:pre-wrap;color:#435267}.record-cost{font-weight:850;white-space:nowrap}.record-tools{display:flex;gap:5px;margin-top:8px}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.thumbs img,.gallery img{width:82px;height:65px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gallery figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f7fafc}.gallery img{width:100%;height:145px;border:0;border-radius:0}.gallery figcaption{font-size:12px;padding:8px;color:var(--muted)}.overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.info-box{border:1px solid var(--line);border-radius:12px;padding:13px}.info-box .label{font-size:12px;color:var(--muted);font-weight:800}.info-box .value{margin-top:5px;font-weight:800;word-break:break-word}.notes{grid-column:1/-1}.image-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.image-preview .preview{position:relative}.image-preview img{width:90px;height:68px;object-fit:cover;border-radius:8px}.image-preview button{position:absolute;right:-5px;top:-6px;border:0;background:var(--red);color:white;width:21px;height:21px;border-radius:50%}.hint{font-size:12px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:13px 17px;border-radius:11px;z-index:200;box-shadow:var(--shadow);max-width:360px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:grid;place-items:center;padding:25px}.lightbox img{max-width:96vw;max-height:90vh;border-radius:8px}.lightbox button{position:absolute;right:20px;top:20px;border:0;background:white;width:40px;height:40px;border-radius:50%;font-size:22px}.storage{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}
    @media(max-width:950px){.vehicle-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.topbar-inner{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.brand small{display:none}main{padding:16px 12px 35px}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:23px}.toolbar{align-items:stretch;flex-direction:column}.vehicle-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.record{grid-template-columns:1fr}.detail-header{flex-direction:column}.detail-km{text-align:left}.overview-grid{grid-template-columns:1fr}.notes{grid-column:auto}.gallery{grid-template-columns:repeat(2,1fr)}.modal{padding:0}.modal-box,.modal-box.wide{border-radius:0;max-height:100vh;height:100vh}.modal-body{padding:16px}.modal-head{padding:14px 16px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="brand-mark">🚗</div><div><h1>Control de Vehículos</h1><small>Mantenimientos, averías e historial</small></div></div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="importBtn">📂 Importar</button>
      <button class="btn btn-ghost" id="exportBtn">💾 Exportar</button>
      <button class="btn btn-light" id="newVehicleBtn">＋ Nuevo vehículo</button>
    </div>
  </div></header>
  <main>
    <section class="stats">
      <div class="stat"><div class="stat-label">VEHÍCULOS</div><div class="stat-value" id="statVehicles">0</div><small>registrados</small></div>
      <div class="stat danger"><div class="stat-label">AVERÍAS ABIERTAS</div><div class="stat-value" id="statBreakdowns">0</div><small>pendientes o en curso</small></div>
      <div class="stat warn"><div class="stat-label">ITV PRÓXIMA / VENCIDA</div><div class="stat-value" id="statItv">0</div><small>en los próximos 60 días</small></div>
      <div class="stat"><div class="stat-label">COSTE TOTAL</div><div class="stat-value" id="statCost">0 €</div><small>mantenimientos y averías</small></div>
    </section>
    <section class="toolbar">
      <div class="search"><span>🔎</span><input id="searchInput" placeholder="Buscar matrícula, marca, modelo o VIN..."></div>
      <select id="statusFilter"><option value="all">Todos los vehículos</option><option value="open">Con averías abiertas</option><option value="itv">ITV próxima o vencida</option></select>
      <select id="sortSelect"><option value="plate">Ordenar por matrícula</option><option value="brand">Ordenar por marca/modelo</option><option value="kmDesc">Más kilómetros</option><option value="recent">Actividad reciente</option></select>
    </section>
    <section class="vehicle-grid" id="vehicleGrid"></section>
    <div class="storage" id="storageInfo"></div>
  </main>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div><div id="lightbox" class="lightbox hidden"><button>×</button><img alt="Imagen ampliada"></div>
<script>
'use strict';
const STORAGE_KEY='controlVehiculos_v1';
let db=loadDB(), currentVehicleId=null, tempImages=[];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function emptyDB(){return {version:1,updatedAt:new Date().toISOString(),vehicles:[]}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&Array.isArray(x.vehicles)?x:emptyDB()}catch(e){return emptyDB()}}
function saveDB(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));render();return true}catch(e){toast('No se ha podido guardar. Reduce el número o tamaño de las imágenes.');return false}}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0)}
function num(n){return new Intl.NumberFormat('es-ES').format(Number(n)||0)}
function dateFmt(d){if(!d)return 'Sin fecha';return new Intl.DateTimeFormat('es-ES').format(new Date(d+'T12:00:00'))}
function vehicleById(id){return db.vehicles.find(v=>v.id===id)}
function allRecords(v){return [...(v.maintenance||[]).map(x=>({...x,kind:'maintenance'})),...(v.breakdowns||[]).map(x=>({...x,kind:'breakdown'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function totalCost(v){return allRecords(v).reduce((s,r)=>s+(Number(r.cost)||0),0)}
function itvState(v){if(!v.itv)return 'none';const today=new Date();today.setHours(0,0,0,0);const d=new Date(v.itv+'T12:00:00');const days=Math.ceil((d-today)/86400000);return days<0?'expired':days<=60?'soon':'ok'}
function recentDate(v){return allRecords(v)[0]?.date||v.createdAt?.slice(0,10)||''}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),3000)}
function render(){renderStats();renderVehicles();const kb=Math.round((localStorage.getItem(STORAGE_KEY)||'').length*2/1024);$('#storageInfo').textContent=`Almacenamiento local usado aproximadamente: ${kb} KB. Exporta copias de seguridad con regularidad.`}
function renderStats(){const vs=db.vehicles;$('#statVehicles').textContent=vs.length;$('#statBreakdowns').textContent=vs.reduce((n,v)=>n+(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,0);$('#statItv').textContent=vs.filter(v=>['soon','expired'].includes(itvState(v))).length;$('#statCost').textContent=money(vs.reduce((s,v)=>s+totalCost(v),0))}
function renderVehicles(){let list=[...db.vehicles],q=$('#searchInput').value.trim().toLowerCase(),f=$('#statusFilter').value,s=$('#sortSelect').value;if(q)list=list.filter(v=>[v.plate,v.brand,v.model,v.vin].some(x=>(x||'').toLowerCase().includes(q)));if(f==='open')list=list.filter(v=>(v.breakdowns||[]).some(x=>x.status!=='Cerrada'));if(f==='itv')list=list.filter(v=>['soon','expired'].includes(itvState(v)));if(s==='plate')list.sort((a,b)=>(a.plate||'').localeCompare(b.plate||''));if(s==='brand')list.sort((a,b)=>`${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`));if(s==='kmDesc')list.sort((a,b)=>(b.km||0)-(a.km||0));if(s==='recent')list.sort((a,b)=>recentDate(b).localeCompare(recentDate(a)));
 const grid=$('#vehicleGrid');if(!list.length){grid.innerHTML=`<div class="empty"><div class="empty-icon">🚙</div><h2>${db.vehicles.length?'No hay coincidencias':'Todavía no hay vehículos'}</h2><p>${db.vehicles.length?'Cambia la búsqueda o los filtros.':'Añade tu primer vehículo para comenzar a registrar mantenimientos, averías, costes e imágenes.'}</p>${db.vehicles.length?'':'<button class="btn btn-primary" onclick="openVehicleForm()">＋ Añadir primer vehículo</button>'}</div>`;return}
 grid.innerHTML=list.map(v=>{const open=(v.breakdowns||[]).filter(x=>x.status!=='Cerrada').length,itv=itvState(v),its=itv==='expired'?'<span class="badge red">ITV vencida</span>':itv==='soon'?'<span class="badge orange">ITV próxima</span>':itv==='ok'?'<span class="badge green">ITV vigente</span>':'';return `<article class="vehicle-card"><div class="vehicle-head"><div><div class="vehicle-title">${esc(v.brand)} ${esc(v.model)}</div><div class="plate">${esc(v.plate)}</div></div><div>🚘</div></div><div class="vehicle-body"><div class="vehicle-meta"><div><div class="meta-label">Kilómetros</div><div class="meta-value">${num(v.km)} km</div></div><div><div class="meta-label">Coste acumulado</div><div class="meta-value">${money(totalCost(v))}</div></div></div><div class="badges"><span class="badge">${(v.maintenance||[]).length} mantenimientos</span>${open?`<span class="badge red">${open} avería${open>1?'s':''}</span>`:''}${its}</div></div><div class="vehicle-actions"><button class="btn btn-soft btn-sm" onclick="openDetail('${v.id}')">Ver historial</button><div><button class="btn btn-soft btn-sm" title="Editar" onclick="openVehicleForm('${v.id}')">✏️</button><button class="btn btn-danger btn-sm" title="Eliminar" onclick="deleteVehicle('${v.id}')">🗑️</button></div></div></article>`}).join('')}
function modal(content,wide=false){$('#modalRoot').innerHTML=`<div class="modal" id="activeModal"><div class="modal-box ${wide?'wide':''}">${content}</div></div>`;$('#activeModal').addEventListener('click',e=>{if(e.target.id==='activeModal')closeModal()})}
function closeModal(){$('#modalRoot').innerHTML='';tempImages=[]}
function openVehicleForm(id=null){const v=id?vehicleById(id):{};modal(`<form id="vehicleForm"><div class="modal-head"><h2>${id?'Editar vehículo':'Nuevo vehículo'}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">
 <div class="field"><label>Matrícula *</label><input name="plate" required maxlength="20" value="${esc(v.plate||'')}" placeholder="1234 ABC"></div><div class="field"><label>Kilómetros actuales *</label><input name="km" type="number" min="0" required value="${v.km??''}" placeholder="45000"></div>
 <div class="field"><label>Marca *</label><input name="brand" required value="${esc(v.brand||'')}" placeholder="SEAT"></div><div class="field"><label>Modelo *</label><input name="model" required value="${esc(v.model||'')}" placeholder="León"></div>
 <div class="field"><label>Año</label><input name="year" type="number" min="1900" max="2100" value="${v.year||''}"></div><div class="field"><label>VIN</label><input name="vin" maxlength="30" value="${esc(v.vin||'')}"></div>
 <div class="field"><label>Fecha de compra</label><input name="purchaseDate" type="date" value="${v.purchaseDate||''}"></div><div class="field"><label>Próxima ITV</label><input name="itv" type="date" value="${v.itv||''}"></div>
 <div class="field"><label>Compañía de seguros</label><input name="insurance" value="${esc(v.insurance||'')}"></div><div class="field"><label>Vencimiento del seguro</label><input name="insuranceExpiry" type="date" value="${v.insuranceExpiry||''}"></div>
 <div class="field full"><label>Observaciones</label><textarea name="notes" placeholder="Información general del vehículo...">${esc(v.notes||'')}</textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-soft" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">Guardar vehículo</button></div></form>`);
 $('#vehicleForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.km=Number(x.km)||0;x.year=x.year?Number(x.year):'';if(id){Object.assign(v,x)}else db.vehicles.push({...x,id:uid('veh'),createdAt:new Date().toISOString(),maintenance:[],breakdowns:[]});if(saveDB()){closeModal();toast('Vehículo guardado')}}}
function deleteVehicle(id){const v=vehicleById(id);if(confirm(`¿Eliminar ${v.plate} y todo su historial? Esta acción no se puede deshacer.`)){db.vehicles=db.vehicles.filter(x=>x.id!==id);saveDB();toast('Vehículo eliminado')}}
function openDetail(id,tab='overview'){currentVehicleId=id;const v=vehicleById(id);modal(`<div class="modal-head"><h2>Ficha del vehículo</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="detail-header"><div><h3>${esc(v.brand)} ${esc(v.model)}</h3><div class="plate">${esc(v.plate)}</div></div><div class="detail-km">${num(v.km)} km<div style="font-size:12px;font-weight:500;opacity:.7">Kilometraje actual</div></div></div>
 <div class="tabs"><button class="tab ${tab==='overview'?'active':''}" data-tab="overview">Resumen</button><button class="tab ${tab==='maintenance'?'active':''}" data-tab="maintenance">Mantenimientos (${(v.maintenance||[]).length})</button><button class="tab ${tab==='breakdowns'?'active':''}" data-tab="breakdowns">Averías (${(v.breakdowns||[]).length})</button><button class="tab ${tab==='gallery'?'active':''}" data-tab="gallery">Galería</button></div>
 <div id="detailContents">${detailContents(v,tab)}</div></div>`,true);$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab))}
function switchTab(tab){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#detailContents').innerHTML=detailContents(vehicleById(currentVehicleId),tab)}
function detailContents(v,tab){if(tab==='overview'){const itv=itvState(v);return `<div class="overview-grid"><div class="info-box"><div class="label">VIN</div><div class="value">${esc(v.vin||'No indicado')}</div></div><div class="info-box"><div class="label">AÑO</div><div class="value">${esc(v.year||'No indicado')}</div></div><div class="info-box"><div class="label">FECHA DE COMPRA</div><div class="value">${v.purchaseDate?dateFmt(v.purchaseDate):'No indicada'}</div></div><div class="info-box"><div class="label">PRÓXIMA ITV</div><div class="value">${v.itv?dateFmt(v.itv):'No indicada'} ${itv==='expired'?'🔴':itv==='soon'?'🟠':itv==='ok'?'🟢':''}</div></div><div class="info-box"><div class="label">SEGURO</div><div class="value">${esc(v.insurance||'No indicado')}</div></div><div class="info-box"><div class="label">VENCIMIENTO SEGURO</div><div class="value">${v.insuranceExpiry?dateFmt(v.insuranceExpiry):'No indicado'}</div></div><div class="info-box"><div class="label">COSTE ACUMULADO</div><div class="value">${money(totalCost(v))}</div></div><div class="info-box"><div class="label">REGISTROS</div><div class="value">${allRecords(v).length}</div></div><div class="info-box notes"><div class="label">OBSERVACIONES</div><div class="value">${esc(v.notes||'Sin observaciones')}</div></div></div>`}
 if(tab==='maintenance')return recordSection(v,'maintenance');if(tab==='breakdowns')return recordSection(v,'breakdown');return gallerySection(v)}
function recordSection(v,kind){const arr=kind==='maintenance'?(v.maintenance||[]):(v.breakdowns||[]),title=kind==='maintenance'?'Mantenimiento':'Avería';return `<div class="section-top"><h3>${kind==='maintenance'?'Historial de mantenimientos':'Historial de averías'}</h3><button class="btn btn-primary btn-sm" onclick="openRecordForm('${kind}')">＋ Añadir ${title.toLowerCase()}</button></div><div class="timeline">${arr.length?[...arr].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>recordHTML(r,kind)).join(''):`<div class="empty"><p>No hay ${kind==='maintenance'?'mantenimientos':'averías'} registrados.</p></div>`}</div>`}
function recordHTML(r,kind){return `<article class="record ${kind==='breakdown'?'breakdown':''}"><div><div class="record-date">${dateFmt(r.date)}</div><div class="record-km">${num(r.km)} km</div></div><div><div class="record-title">${esc(r.title||r.type||'Sin título')}</div><div class="record-desc">${esc(r.description||'')}</div><div class="badges" style="margin-top:8px">${r.workshop?`<span class="badge">${esc(r.workshop)}</span>`:''}${r.status?`<span class="badge ${r.status==='Cerrada'?'green':r.priority==='Alta'?'red':'orange'}">${esc(r.status)}</span>`:''}${r.priority?`<span class="badge">Prioridad ${esc(r.priority)}</span>`:''}</div>${r.images?.length?`<div class="thumbs">${r.images.map(im=>`<img src="${im.data}" alt="${esc(im.name)}" onclick="showImage(this.src)">`).join('')}</div>`:''}<div class="record-tools"><button class="btn btn-soft btn-sm" onclick="openRecordForm('${kind}','${r.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="deleteRecord('${kind}','${r.id}')">Eliminar</button></div></div><div class="record-cost">${r.cost?money(r.cost):''}</div></article>`}
function openRecordForm(kind,rid=null){const v=vehicleById(currentVehicleId),arr=kind==='maintenance'?v.maintenance:v.breakdowns,r=rid?arr.find(x=>x.id===rid):{};tempImages=[...(r.images||[])];const isM=kind==='maintenance';modal(`<form id="recordForm"><div class="modal-head"><h2>${rid?'Editar':'Nuevo'} ${isM?'mantenimiento':'registro de avería'}</h2><button type="button" class="close" onclick="openDetail('${v.id}','${isM?'maintenance':'breakdowns'}')">×</button></div><div class="modal-body"><div class="form-grid">
 <div class="field"><label>Fecha *</label><input name="date" type="date" required value="${r.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Kilómetros *</label><input name="km" type="number" min="0" required value="${r.km??v.km??''}"></div>
 <div class="field"><label>${isM?'Tipo de mantenimiento':'Título de la avería'} *</label>${isM?`<select name="type" required><option value="">Selecciona...</option>${['Revisión','Aceite y filtros','Neumáticos','Frenos','Batería','ITV','Otro'].map(x=>`<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="title" required value="${esc(r.title||'')}" placeholder="Ej. Fallo del sensor ABS">`}</div><div class="field"><label>Coste (€)</label><input name="cost" type="number" min="0" step="0.01" value="${r.cost??''}"></div>
 <div class="field"><label>Taller / proveedor</label><input name="workshop" value="${esc(r.workshop||'')}"></div>${isM?'<div></div>':`<div class="field"><label>Estado</label><select name="status">${['Abierta','En reparación','Cerrada'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Prioridad</label><select name="priority">${['Baja','Media','Alta'].map(x=>`<option ${r.priority===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
 <div class="field full"><label>Descripción de lo realizado / detectado *</label><textarea name="description" required placeholder="Describe con detalle la intervención, piezas cambiadas, diagnóstico...">${esc(r.description||'')}</textarea></div><div class="field full"><label>Imágenes</label><input id="imageInput" type="file" accept="image/*" multiple><div class="hint">Las imágenes se reducen antes de guardarse. Quedarán incluidas en el JSON exportado.</div><div class="image-preview" id="imagePreview"></div></div></div></div><div class="modal-foot"><button type="button" class="btn btn-soft" onclick="openDetail('${v.id}','${isM?'maintenance':'breakdowns'}')">Cancelar</button><button class="btn btn-primary">Guardar registro</button></div></form>`);
 renderImagePreview();$('#imageInput').onchange=async e=>{for(const file of e.target.files){try{tempImages.push({id:uid('img'),name:file.name,data:await compressImage(file)})}catch(err){toast('No se pudo procesar '+file.name)}}renderImagePreview()};$('#recordForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));delete x[''];x.km=Number(x.km)||0;x.cost=Number(x.cost)||0;x.images=tempImages;if(rid)Object.assign(r,x);else arr.push({...x,id:uid('rec'),createdAt:new Date().toISOString()});if(x.km>v.km)v.km=x.km;if(saveDB()){openDetail(v.id,isM?'maintenance':'breakdowns');toast('Registro guardado')}}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
function renderImagePreview(){const p=$('#imagePreview');if(p)p.innerHTML=tempImages.map((im,i)=>`<div class="preview"><img src="${im.data}" alt="${esc(im.name)}"><button type="button" onclick="removeTempImage(${i})">×</button></div>`).join('')}
function removeTempImage(i){tempImages.splice(i,1);renderImagePreview()}
function deleteRecord(kind,id){if(!confirm('¿Eliminar este registro?'))return;const v=vehicleById(currentVehicleId),key=kind==='maintenance'?'maintenance':'breakdowns';v[key]=v[key].filter(x=>x.id!==id);saveDB();openDetail(v.id,key==='maintenance'?'maintenance':'breakdowns');toast('Registro eliminado')}
function gallerySection(v){const imgs=allRecords(v).flatMap(r=>(r.images||[]).map(im=>({...im,date:r.date,title:r.title||r.type})));return `<div class="section-top"><h3>Galería de imágenes</h3><span class="hint">${imgs.length} imagen${imgs.length===1?'':'es'}</span></div>${imgs.length?`<div class="gallery">${imgs.map(im=>`<figure><img src="${im.data}" alt="${esc(im.name)}" onclick="showImage(this.src)"><figcaption>${dateFmt(im.date)} · ${esc(im.title||'Registro')}</figcaption></figure>`).join('')}</div>`:'<div class="empty"><p>Las imágenes añadidas a mantenimientos y averías aparecerán aquí.</p></div>'}`}
function showImage(src){$('#lightbox img').src=src;$('#lightbox').classList.remove('hidden')}
function exportDB(){if(!db.vehicles.length&&!confirm('La base de datos está vacía. ¿Quieres exportarla igualmente?'))return;const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),d=new Date().toISOString().slice(0,10);a.href=URL.createObjectURL(blob);a.download=`backup_vehiculos_${d}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Copia de seguridad exportada')}
function importDB(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.vehicles))throw Error();if(!confirm(`Se importarán ${x.vehicles.length} vehículos y se reemplazarán los datos actuales. ¿Continuar?`))return;db=x;db.version=1;if(saveDB())toast('Base de datos importada correctamente')}catch(e){toast('El archivo no es una copia de seguridad válida')}};reader.readAsText(file)}
$('#newVehicleBtn').onclick=()=>openVehicleForm();$('#exportBtn').onclick=exportDB;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};$('#searchInput').oninput=renderVehicles;$('#statusFilter').onchange=renderVehicles;$('#sortSelect').onchange=renderVehicles;$('#lightbox button').onclick=()=>$('#lightbox').classList.add('hidden');document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#lightbox').classList.contains('hidden'))$('#lightbox').classList.add('hidden');else closeModal()}});render();
</script>
</body>
</html>
